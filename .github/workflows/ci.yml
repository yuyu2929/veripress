name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 未纳入 macos-latest：本账号的 macOS runner 会排队后 0 步取消（配额问题）
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: pytest tests/ -q
      - name: Demo smoke（全链路脚本）
        run: python scripts/demo.py
      - name: 密钥生成 + 许可证签发冒烟
        run: |
          python scripts/gen_keys.py
          python scripts/issue_license.py --org "CI Test" --seats 3 --days 30 > license.txt
          python -c "import pathlib,sys; t=pathlib.Path('license.txt').read_text().strip(); assert t.startswith('VP1.'), t; print('license ok', t[:12])"
      - name: 服务可启动（导入 + 建 app）
        run: python -c "from veripress.api import create_app; app=create_app(); print(type(app).__name__)"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: 校验 wheel 内含公钥与前端静态页
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          for must in ("veripress/license_public.pem",
                       "veripress/compliance_public.pem",
                       "veripress/webapp/static/index.html"):
              assert any(n.endswith(must) for n in names), f"wheel 缺少 {must}"
          print("wheel ok:", whl, len(names), "files")
          PY
